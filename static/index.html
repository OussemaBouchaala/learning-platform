<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<style>
:root {
  --paper: #F4F6FA;
  --sheet: #FFFFFF;
  --ink: #172340;
  --ink-soft: #56627E;
  --line: #D9E0EB;
  --cobalt: #2650E0;
  --cobalt-soft: #E6ECFD;
  --marker: #FFE066;
  --ok: #1E8556;
  --err: #C13A2A;
  --editor: #13203A;
  --editor-text: #E4EAF6;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --r-sm: 4px;
  --r-md: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  color: var(--ink); background: var(--paper);
  display: grid; grid-template-rows: auto 1fr;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
a { color: var(--cobalt); }

/* Header + roadmap rail */
header {
  display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center;
  padding: 12px 20px; background: var(--sheet); border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; line-height: 1.15; }
.brand strong { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--ink-soft); }
.rail { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; min-width: 0; }
.seg {
  position: relative; height: 34px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--paper); padding: 0; overflow: hidden; text-align: left;
}
.seg .fill { position: absolute; inset: 0 auto 0 0; background: var(--cobalt-soft); transition: width .4s; }
.seg .lbl { position: relative; display: block; padding: 0 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-soft); line-height: 32px; white-space: nowrap; }
.seg.phase-start { margin-left: 8px; }
.seg.current { border-color: var(--cobalt); }
.seg.current .lbl { color: var(--cobalt); }
.seg.selected { box-shadow: inset 0 -3px 0 var(--cobalt); }
.stats { display: flex; gap: 16px; font-size: 13px; color: var(--ink-soft); }
.stats b { display: block; font-size: 17px; color: var(--ink); font-weight: 600; line-height: 1.2; }

/* Layout */
main { display: grid; grid-template-columns: 250px minmax(340px, 1fr) minmax(420px, 1.15fr); min-height: 0; }
aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 0; background: var(--sheet); }
.wk { padding: 8px 16px 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
.wk small { font-weight: 400; }
.day {
  display: grid; grid-template-columns: 22px 1fr; gap: 6px; width: 100%; padding: 7px 16px;
  border: 0; background: none; text-align: left; font-size: 13.5px;
}
.day:hover { background: var(--paper); }
.day.active { background: var(--cobalt-soft); }
.day .mark { width: 16px; height: 16px; margin-top: 2px; border: 1.5px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 10px; }
.day.done .mark { background: var(--ok); border-color: var(--ok); color: #fff; }
.day.today .mark { border-color: var(--cobalt); }
.day .when { display: block; font-size: 11.5px; color: var(--ink-soft); }
.locked-row { padding: 6px 16px 6px 44px; font-size: 13px; color: var(--ink-soft); background: none; border: 0; width: 100%; text-align: left; }
.locked-row:hover { color: var(--ink); }

/* Lesson pane: graph paper */
.lesson {
  overflow-y: auto; border-right: 1px solid var(--line);
  background-color: var(--paper);
  background-image:
    linear-gradient(rgba(38,80,224,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(38,80,224,.05) 1px, transparent 1px);
  background-size: 24px 24px;
}
.lesson-head { padding: 22px 28px 0; }
.lesson-head .meta { font-size: 13px; color: var(--ink-soft); }
.lesson-head h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 8px; font-weight: 600; letter-spacing: -0.015em; }
.why { margin: 0 0 14px; padding-left: 12px; border-left: 3px solid var(--cobalt); color: var(--ink-soft); max-width: 68ch; }
.tabs { display: flex; gap: 2px; padding: 0 28px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 2; }
.tab { border: 0; background: none; padding: 9px 12px; font-size: 14px; color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.tab .count { font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
.pane { padding: 18px 28px 48px; max-width: 760px; }
.prose h3 { font-size: 18px; margin: 26px 0 8px; font-weight: 600; }
.prose h3:first-child { margin-top: 4px; }
.prose h4 { font-size: 15.5px; margin: 20px 0 6px; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 22px; }
.prose code { font-family: var(--mono); font-size: 13px; background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.snippet { margin: 12px 0 16px; border-radius: var(--r-md); overflow: hidden; background: var(--editor); }
.snippet pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--editor-text); font: 13px/1.6 var(--mono); }
.snippet pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }
.snippet-bar { display: flex; justify-content: flex-end; gap: 6px; padding: 6px 8px; background: rgba(255,255,255,.04); border-top: 1px solid rgba(255,255,255,.08); }
.snippet-bar button { border: 1px solid rgba(255,255,255,.18); background: none; color: var(--editor-text); font-size: 12.5px; padding: 3px 10px; border-radius: var(--r-sm); }
.snippet-bar button:hover { background: rgba(255,255,255,.08); }
.snippet .out { background: var(--sheet); border-top: 1px solid var(--line); }
.resources { margin-top: 28px; padding-top: 14px; border-top: 1px dashed var(--line); }
.resources h3 { font-size: 15px; margin: 0 0 6px; }
.done-when { margin-top: 18px; padding: 10px 14px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-md); font-size: 14px; }

/* Tasks */
.task { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.task input { width: 17px; height: 17px; margin-top: 3px; accent-color: var(--ok); cursor: pointer; }
.task.checked span { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(86,98,126,.5); }

/* Quiz */
.q { margin: 0 0 22px; }
.q-text { font-weight: 500; margin-bottom: 8px; }
.q-text pre { font: 13px/1.55 var(--mono); background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; margin: 6px 0 0; white-space: pre-wrap; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; margin: 4px 0; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; font-size: 14px; }
.opt input { margin-top: 4px; accent-color: var(--cobalt); }
.opt code { font-family: var(--mono); font-size: 13px; }
.opt.right { border-color: var(--ok); background: #EAF6EF; }
.opt.wrong { border-color: var(--err); background: #FBECEA; }
.explain { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; }
.score { padding: 12px 14px; border-radius: var(--r-md); background: var(--sheet); border: 1px solid var(--line); margin-bottom: 18px; }
.score.pass { border-color: var(--ok); }
.score.fail { border-color: var(--err); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--sheet); padding: 7px 14px; border-radius: var(--r-sm); font-size: 14px; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 500; }
.btn.primary:hover { background: #24345C; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Notes */
.notes { width: 100%; min-height: 340px; padding: 14px; font: 14px/1.6 var(--mono); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--sheet); color: var(--ink); resize: vertical; }

/* Workspace */
.work { display: grid; grid-template-rows: auto minmax(200px, 1fr) auto auto minmax(140px, 0.8fr); min-height: 0; background: var(--sheet); }
.files { display: flex; gap: 0; overflow-x: auto; background: var(--editor); padding: 0 8px; }
.file { border: 0; background: none; color: rgba(228,234,246,.6); font: 13px var(--mono); padding: 10px 12px; white-space: nowrap; border-bottom: 2px solid transparent; }
.file[aria-selected="true"] { color: var(--editor-text); border-bottom-color: var(--marker); }
.editor-wrap { min-height: 0; position: relative; background: var(--editor); }
.CodeMirror { height: 100%; font: 13.5px/1.6 var(--mono); background: var(--editor); color: var(--editor-text); }
.CodeMirror-gutters { background: var(--editor); border-right: 1px solid rgba(255,255,255,.07); }
.CodeMirror-linenumber { color: rgba(228,234,246,.32); }
.CodeMirror-cursor { border-left: 2px solid var(--marker); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: rgba(255,224,102,.18) !important; }
.cm-s-default .cm-keyword { color: #8FB0FF; }
.cm-s-default .cm-def { color: #FFE066; }
.cm-s-default .cm-string { color: #9FE0B8; }
.cm-s-default .cm-comment { color: #7F8DA8; font-style: italic; }
.cm-s-default .cm-number { color: #F7B27A; }
.cm-s-default .cm-builtin { color: #C9B6FF; }
.cm-s-default .cm-variable, .cm-s-default .cm-variable-2, .cm-s-default .cm-property { color: var(--editor-text); }
.cm-s-default .cm-operator { color: #B9C4DA; }
.cm-s-default .cm-meta { color: #F7B27A; }
.fallback-editor { width: 100%; height: 100%; border: 0; padding: 12px 16px; background: var(--editor); color: var(--editor-text); font: 13.5px/1.6 var(--mono); resize: none; }

/* The highlighter: predict before you run */
.predict { padding: 10px 16px 0; border-top: 1px solid var(--line); }
.predict label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.predict label span { font-weight: 400; color: var(--ink-soft); font-size: 12.5px; }
.predict textarea {
  width: 100%; min-height: 54px; max-height: 140px; resize: vertical; padding: 8px 10px;
  font: 13px/1.5 var(--mono); color: var(--ink); border: 0; border-radius: 2px;
  background: linear-gradient(transparent 0, var(--marker) 0) no-repeat; background-color: #FFF6C7;
  box-shadow: inset 0 -2px 0 #E8C63A;
}
.actions { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.actions .hint { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); }
.save-state { font-size: 12.5px; color: var(--ink-soft); }
.output { overflow-y: auto; padding: 12px 16px 20px; min-height: 0; }
.out-meta { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
.out-meta .ok { color: var(--ok); font-weight: 500; }
.out-meta .bad { color: var(--err); font-weight: 500; }
.stdout, .stderr { margin: 0 0 8px; font: 13px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
.stderr { color: var(--err); }
.output img, .snippet .out img { max-width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); margin: 6px 0; background: #fff; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.compare div { padding: 8px 10px; border-radius: var(--r-sm); font: 12.5px/1.5 var(--mono); white-space: pre-wrap; max-height: 160px; overflow: auto; }
.compare .yours { background: #FFF6C7; }
.compare .actual { background: var(--paper); border: 1px solid var(--line); }
.compare b { display: block; font-family: var(--sans); font-size: 12px; margin-bottom: 2px; }
.empty { color: var(--ink-soft); font-size: 14px; }

/* Check results */
.file .tick { color: #7FD8A6; margin-left: 5px; }
.checks-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 14px; }
.checks-head b { font-size: 15px; }
.checks-head.all b { color: var(--ok); }
.checks-head.some b { color: var(--err); }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.checks li:last-child { border-bottom: 0; }
.checks .icon { font-weight: 600; text-align: center; }
.checks .pass .icon { color: var(--ok); }
.checks .fail .icon { color: var(--err); }
.checks .hint { display: block; color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
.checks .detail { display: block; margin: 4px 0 0; font: 12.5px/1.5 var(--mono); color: var(--err); white-space: pre-wrap; word-break: break-word; }
.match-line { display: block; }
.match-line.hit::before { content: "\2713  "; color: var(--ok); }
.match-line.miss::before { content: "\2717  "; color: var(--err); }
.match-sum { display: block; font-family: var(--sans); font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.locked { padding: 28px; color: var(--ink-soft); max-width: 60ch; }
.locked code { font-family: var(--mono); font-size: 13px; background: var(--paper); padding: 2px 6px; border-radius: 3px; color: var(--ink); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: var(--r-md); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
.toast.show { opacity: 1; }
.mobile-nav { display: none; }

@media (max-width: 1180px) {
  main { grid-template-columns: minmax(320px, 1fr) minmax(380px, 1.1fr); }
  aside { display: none; }
  .mobile-nav { display: block; padding: 12px 28px 0; }
  .mobile-nav select { width: 100%; padding: 7px; font: inherit; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--sheet); }
  .stats { display: none; }
  header { grid-template-columns: auto 1fr; }
}
@media (max-width: 820px) {
  body { display: block; }
  main { display: block; }
  .lesson { border-right: 0; }
  .work { height: 92vh; border-top: 1px solid var(--line); }
  header { grid-template-columns: 1fr; gap: 10px; }
  .seg .lbl { font-size: 10px; padding: 0 3px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><strong>Bench</strong><span>Oussema's 12-week plan</span></div>
  <nav class="rail" id="rail" aria-label="12-week roadmap"></nav>
  <div class="stats" id="stats"></div>
</header>
<main>
  <aside id="sidebar" aria-label="Days"></aside>
  <section class="lesson" id="lesson"></section>
  <section class="work" id="work"></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const S = { weeks: [], progress: {}, week: 0, day: null, tab: "lesson", file: null, editor: null, quizState: {} };
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

/* ---------- Progress ---------- */
const P = () => S.progress;
function ensureProgress() {
  const p = S.progress;
  for (const k of ["tasks", "weekTasks", "quiz", "retest", "predictions", "checks"]) p[k] ??= {};
  p.activity ??= []; p.settings ??= { predictFirst: true }; p.last ??= {};
}
let saveProgressTimer;
function saveProgress() {
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(() => api("/api/progress", S.progress).catch(e => toast("Progress not saved: " + e.message)), 400);
}
function logActivity() {
  const t = todayISO();
  if (!P().activity.includes(t)) { P().activity.push(t); saveProgress(); renderStats(); }
}
const allDays = () => S.weeks.flatMap(w => w.days);
const findDay = id => allDays().find(d => d.id === id);
const weekOfDay = id => S.weeks.findIndex(w => w.days.some(d => d.id === id));
function dayDone(d) { const t = P().tasks[d.id] || []; return d.tasks.length > 0 && d.tasks.every((_, i) => t[i]); }
function weekCounts(w) {
  if (w.days.length) {
    let done = 0, total = 0;
    for (const d of w.days) { total += d.tasks.length; done += (P().tasks[d.id] || []).filter(Boolean).length; }
    return { done, total };
  }
  const t = P().weekTasks[w.n] || [];
  return { done: t.filter(Boolean).length, total: w.tasks.length };
}
function xp() {
  let x = 0;
  for (const v of Object.values(P().tasks)) x += v.filter(Boolean).length * 10;
  for (const v of Object.values(P().weekTasks)) x += v.filter(Boolean).length * 10;
  for (const v of Object.values(P().quiz)) x += v.best * 5;
  for (const v of Object.values(P().retest)) x += v.best >= 8 ? 50 : 0;
  return x;
}
function streak() {
  const set = new Set(P().activity); let n = 0; const d = new Date();
  if (!set.has(todayISO())) d.setDate(d.getDate() - 1);
  while (true) {
    const iso = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    if (!set.has(iso)) break; n++; d.setDate(d.getDate() - 1);
  }
  return n;
}

/* ---------- Header ---------- */
function currentWeekIndex() {
  const t = todayISO(), days = allDays();
  const exact = days.find(d => d.date === t);
  if (exact) return weekOfDay(exact.id);
  if (days.length && t < days[0].date) return 0;
  return Math.max(0, weekOfDay((days.filter(d => d.date <= t).pop() || days[0]).id));
}
function renderRail() {
  const cur = currentWeekIndex();
  $("#rail").innerHTML = S.weeks.map((w, i) => {
    const { done, total } = weekCounts(w);
    const pct = total ? Math.round(100 * done / total) : 0;
    const phaseStart = i > 0 && w.phase !== S.weeks[i - 1].phase;
    return `<button class="seg ${i === cur ? "current" : ""} ${i === S.week ? "selected" : ""} ${phaseStart ? "phase-start" : ""}"
      data-week="${i}" title="Week ${w.n}: ${esc(w.title)} (${w.dates}), ${pct}% done">
      <span class="fill" style="width:${pct}%"></span><span class="lbl">W${w.n}</span></button>`;
  }).join("");
  $("#rail").onclick = e => { const b = e.target.closest(".seg"); if (b) selectWeek(+b.dataset.week); };
}
function renderStats() {
  let done = 0, total = 0;
  for (const w of S.weeks) { const c = weekCounts(w); done += c.done; total += c.total; }
  $("#stats").innerHTML = `
    <div><b>${streak()} day${streak() === 1 ? "" : "s"}</b>streak</div>
    <div><b>${xp()}</b>XP</div>
    <div><b>${total ? Math.round(100 * done / total) : 0}%</b>of the plan</div>`;
  renderRail();
}

/* ---------- Sidebar ---------- */
function renderSidebar() {
  const t = todayISO();
  let html = "";
  S.weeks.forEach((w, i) => {
    html += `<div class="wk">Week ${w.n}: ${esc(w.title)} <small>${w.dates}</small></div>`;
    if (w.days.length) {
      for (const d of w.days) {
        const cls = [S.day?.id === d.id ? "active" : "", dayDone(d) ? "done" : "", d.date === t ? "today" : ""].join(" ");
        html += `<button class="day ${cls}" data-day="${d.id}"><span class="mark">${dayDone(d) ? "✓" : ""}</span>
          <span>${esc(d.title)}<span class="when">${d.weekday} ${d.date.slice(5).replace("-", "/")}</span></span></button>`;
      }
    } else {
      html += `<button class="locked-row" data-week="${i}">Weekly goals</button>`;
    }
  });
  $("#sidebar").innerHTML = html;
  $("#sidebar").onclick = e => {

}
function bindMobileNav() {

/* ---------- Navigation ---------- */
function selectWeek(i) {

  const w = S.weeks[i];
  if (w.days.length) {
    const t = todayISO();

/* ---------- Markdown ---------- */
function inline(s) {
  s = esc(s); const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const parts = src.trim().split(/```(\w*)\n([\s\S]*?)```/g);
  let html = "";
  for (let i = 0; i < parts.length; i += 3) {
    html += blocks(parts[i]);
    if (i + 2 < parts.length) {
      const lang = parts[i + 1], code = parts[i + 2].replace(/\n$/, "");
      const runnable = lang === "python";
      html += `<div class="snippet"><pre><code>${esc(code)}</code></pre><div class="snippet-bar">
        <button data-copy>Copy</button>${runnable ? "<button data-run>Run snippet</button>" : ""}</div>
        <div class="out" hidden></div><textarea hidden>${esc(code)}</textarea></div>`;
    }
  }
  return html;
}
function blocks(text) {
  const out = []; let list = null, para = [];
  const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushP(); flushL(); continue; }
    if ((m = line.match(/^(#{2,4})\s+(.*)/))) { flushP(); flushL(); out.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`); continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)/))) { flushP(); if (!list || list.tag !== "ul") { flushL(); list = { tag: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { flushP(); if (!list || list.tag !== "ol") { flushL(); list = { tag: "ol", items: [] }; } list.items.push(m[1]); continue; }
    if (list) { list.items[list.items.length - 1] += " " + line.trim(); continue; }
    para.push(line.trim());
  }
  flushP(); flushL(); return out.join("");
}

/* ---------- Lesson pane ---------- */
function renderLesson() {
  const d = S.day, w = S.weeks[S.week];
  const tasksDone = (P().tasks[d.id] || []).filter(Boolean).length;
  const q = P().quiz[d.id];
  const tabs = [["lesson", "Lesson", ""], ["tasks", "Tasks", `${tasksDone}/${d.tasks.length}`], ["quiz", "Quiz", q ? `${q.best}/${q.total}` : ""], ["notes", "Notes", ""]];
  if (d.retest) { const r = P().retest[d.id]; tabs.push(["retest", "Re-test", r ? `${r.best}/${r.total}` : ""]); }
  $("#lesson").innerHTML = `
    ${mobileNav()}
    <div class="lesson-head">
      <div class="meta">Week ${w.n}, ${d.weekday} ${d.date.slice(5).replace("-", "/")}. About ${d.minutes} minutes.</div>

    </div>

      `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${label}${c ? `<span class="count">${c}</span>` : ""}</button>`).join("")}</div>
    <div class="pane" id="pane"></div>`;
  $(".tabs").onclick = e => { const t = e.target.closest(".tab"); if (t) { S.tab = t.dataset.tab; renderLesson(); } };
  bindMobileNav();
  ({ lesson: paneLesson, tasks: paneTasks, quiz: () => paneQuiz("quiz"), retest: () => paneQuiz("retest"), notes: paneNotes })[S.tab]();
}
function paneLesson() {
  const d = S.day;
  const res = d.resources.length ? `<div class="resources"><h3>Resources</h3><ul>${d.resources.map(r => `<li><a href="${r.url}" target="_blank" rel="noopener">${esc(r.label)}</a></li>`).join("")}</ul></div>` : "";
  $("#pane").className = "pane prose";
  $("#pane").innerHTML = md(d.lesson) + `<div class="done-when"><strong>Done when:</strong> ${inline(d.done_when)}</div>` + res;
  $("#pane").onclick = async e => {
    const snip = e.target.closest(".snippet"); if (!snip) return;
    const code = snip.querySelector("textarea").value;
    if (e.target.matches("[data-copy]")) { await navigator.clipboard.writeText(code).catch(() => {}); toast("Copied"); }
    if (e.target.matches("[data-run]")) {
      const out = snip.querySelector(".out"); out.hidden = false; out.innerHTML = `<div class="output"><div class="empty">Running…</div></div>`;
      try { const r = await api("/api/run", { day: S.day.folder, name: null, code }); out.innerHTML = `<div class="output">${renderResult(r)}</div>`; logActivity(); }
      catch (err) { out.innerHTML = `<div class="output"><pre class="stderr">${esc(err.message)}</pre></div>`; }

}
function paneTasks() {
  const d = S.day, t = P().tasks[d.id] ||= [];
  $("#pane").className = "pane";
  $("#pane").innerHTML = d.tasks.map((task, i) =>
    `<label class="task ${t[i] ? "checked" : ""}"><input type="checkbox" data-i="${i}" ${t[i] ? "checked" : ""}><span>${inline(task)}</span></label>`).join("")
    + `<div class="done-when"><strong>Done when:</strong> ${inline(d.done_when)}</div>`;
  $("#pane").onchange = e => {
    const i = +e.target.dataset.i; t[i] = e.target.checked;
    e.target.closest(".task").classList.toggle("checked", t[i]);
    saveProgress(); logActivity(); renderStats(); renderSidebar();
    if (dayDone(d)) toast("Day complete. Nice work.");
    const c = $('.tab[data-tab="tasks"] .count'); if (c) c.textContent = `${t.filter(Boolean).length}/${d.tasks.length}`;
  };
}
function paneQuiz(kind) {
  const d = S.day, qs = kind === "retest" ? d.retest : d.quiz, store = kind === "retest" ? P().retest : P().quiz;
  const st = S.quizState[kind] ||= { answers: {}, submitted: false, order: qs.map(q => shuffle(q.options.map((_, j) => j))) };
  const prev = store[d.id];
  $("#pane").className = "pane";
  let head = "";
  if (kind === "retest") head = `<p class="why">Ten new questions on Week 1. Score 8 or more to validate Month 1 and unlock Phase 1.</p>`;
  if (st.submitted) {
    const score = qs.filter((q, i) => st.answers[i] === q.answer).length;
    const pass = kind !== "retest" || score >= 8;
    head += `<div class="score ${pass ? "pass" : "fail"}"><strong>${score}/${qs.length}.</strong> ${kind === "retest"
      ? (pass ? "Month 1 validated. Phase 1 is open." : "Not yet. Redo the topics you missed on Mon-Tue of Week 2, then retake it.")
      : score === qs.length ? "All correct." : "Read the explanations for the ones you missed."}
      <button class="btn" id="retake" style="margin-left:8px">Retake</button></div>`;
  } else if (prev) head += `<p class="empty">Best so far: ${prev.best}/${prev.total}</p>`;
  $("#pane").innerHTML = head + qs.map((q, i) => {
    const [first, ...rest] = q.q.split("\n");
    const qtext = rest.length ? `${inline(first)}<pre>${esc(rest.join("\n"))}</pre>` : inline(q.q);
    return `<div class="q"><div class="q-text">${i + 1}. ${qtext}</div>${st.order[i].map(j => {
      const o = q.options[j]; let cls = "";
      if (st.submitted) cls = j === q.answer ? "right" : st.answers[i] === j ? "wrong" : "";
      return `<label class="opt ${cls}"><input type="radio" name="q${i}" value="${j}" ${st.answers[i] === j ? "checked" : ""} ${st.submitted ? "disabled" : ""}><span>${inline(o)}</span></label>`;
    }).join("")}${st.submitted ? `<div class="explain">${inline(q.explain)}</div>` : ""}</div>`;
  }).join("") + (st.submitted ? "" : `<button class="btn primary" id="submitQuiz">Check answers</button>`);
  $("#pane").onchange = e => { if (e.target.name) st.answers[+e.target.name.slice(1)] = +e.target.value; };
  $("#submitQuiz")?.addEventListener("click", () => {
    if (Object.keys(st.answers).length < qs.length) return toast(`Answer all ${qs.length} questions first`);
    st.submitted = true;
    const score = qs.filter((q, i) => st.answers[i] === q.answer).length;
    const rec = store[d.id] ||= { best: 0, total: qs.length, attempts: 0 };
    rec.best = Math.max(rec.best, score); rec.attempts++; rec.last = score;
    saveProgress(); logActivity(); renderStats(); renderLesson();
    $("#lesson").scrollTop = 0;
  });
  $("#retake")?.addEventListener("click", () => { delete S.quizState[kind]; renderLesson(); });
}
async function paneNotes() {
  const d = S.day;
  $("#pane").className = "pane";
  $("#pane").innerHTML = `<p class="empty">Saved to <code>${d.folder}/notes.md</code>. Write answers as if an interviewer asked.</p>
    <textarea class="notes" id="notes" placeholder="In 3-5 lines: ..."></textarea><div class="save-state" id="notesState"></div>`;

}

/* ---------- Locked week ---------- */
function renderLockedWeek(w) {

  $("#lesson").innerHTML = `${mobileNav()}<div class="lesson-head"><div class="meta">${w.phase}, ${w.dates}</div>

/* ---------- Workspace ---------- */
function renderWork() {
  const d = S.day;
  const remembered = P().last.file && d.files.find(f => f.name === P().last.file);
  S.file = (remembered || d.files[0])?.name;
  $("#work").innerHTML = `
    <div class="files" role="tablist">${d.files.map(f => `<button class="file" role="tab" data-file="${f.name}" aria-selected="${f.name === S.file}">${f.name}${checkTick(d, f)}</button>`).join("")}</div>
    <div class="editor-wrap" id="editorWrap"></div>
    <div class="predict" id="predictBox"><label for="predict">Your prediction <span>Write what you expect before you run</span></label>
      <textarea id="predict" placeholder="Expected output, error, or timing…"></textarea></div>
    <div class="actions">
      <button class="btn primary" id="runBtn">Run</button>
      <button class="btn" id="checkBtn" title="Run the automatic checks for this exercise (Ctrl+Shift+Enter)">Check</button>
      <button class="btn" id="resetBtn">Reset to starter</button>
      <label style="font-size:13px;display:flex;gap:5px;align-items:center"><input type="checkbox" id="pf" ${P().settings.predictFirst ? "checked" : ""}>Predict before running</label>
      <span class="save-state" id="saveState"></span>
      <span class="hint">Ctrl+Enter runs, Ctrl+Shift+Enter checks. Files save to ${d.folder}/</span>
    </div>
    <div class="output" id="output"><div class="empty">Output appears here. Write a prediction first: comparing it with the real output is where the learning happens.
      When you think your code is done, press <b>Check</b> to see what's right and what's missing.</div></div>`;
  $(".files").onclick = e => { const b = e.target.closest(".file"); if (b) openFile(b.dataset.file); };
  $("#runBtn").onclick = runCurrent;
  $("#checkBtn").onclick = checkCurrent;
  $("#resetBtn").onclick = resetFile;
  $("#pf").onchange = e => { P().settings.predictFirst = e.target.checked; saveProgress(); updateRunState(); };
  $("#predict").oninput = e => { P().predictions[`${d.folder}/${S.file}`] = e.target.value; saveProgress(); updateRunState(); };
  mountEditor();
  openFile(S.file);
}
function mountEditor() {
  const wrap = $("#editorWrap");
  if (window.CodeMirror) {
    S.editor = CodeMirror(wrap, { lineNumbers: true, indentUnit: 4, tabSize: 4, matchBrackets: true,
      extraKeys: { "Ctrl-Enter": runCurrent, "Cmd-Enter": runCurrent, "Ctrl-S": () => saveFile(true), "Cmd-S": () => saveFile(true),
        Tab: cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ") } });
    S.editor.addKeyMap({ "Shift-Ctrl-Enter": checkCurrent, "Shift-Cmd-Enter": checkCurrent });
    S.editor.on("change", (_, ch) => { if (ch.origin !== "setValue") scheduleSave(); });
  } else {
    const ta = document.createElement("textarea"); ta.className = "fallback-editor"; ta.spellcheck = false; wrap.appendChild(ta);
    S.editor = { getValue: () => ta.value, setValue: v => (ta.value = v), setOption() {}, refresh() {}, focus: () => ta.focus() };
    ta.oninput = scheduleSave;
    ta.onkeydown = e => {
      if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") e.shiftKey ? checkCurrent() : runCurrent();
    };
  }
}
const modeFor = n => n.endsWith(".py") ? "python" : /\.ya?ml$/.test(n) ? "yaml" : n.endsWith(".json") ? { name: "javascript", json: true } : n.endsWith(".md") ? "markdown" : null;
async function openFile(name) {
  S.file = name; P().last.file = name; saveProgress();
  document.querySelectorAll(".file").forEach(b => b.setAttribute("aria-selected", b.dataset.file === name));
  const f = S.day.files.find(x => x.name === name);
  const r = await api(`/api/file?day=${S.day.folder}&name=${encodeURIComponent(name)}`);
  const content = r.content.trim() ? r.content : f.starter;
  S.editor.setOption("mode", modeFor(name));
  S.editor.setValue(content);
  if (!r.content.trim()) await api("/api/file", { day: S.day.folder, name, content });
  setTimeout(() => S.editor.refresh(), 0);
  const isPy = name.endsWith(".py");
  $("#predictBox").hidden = !isPy;
  $("#predict").value = P().predictions[`${S.day.folder}/${name}`] || "";
  $("#saveState").textContent = r.content.trim() ? "Loaded your file" : "Starter written to disk";
  updateRunState();
}
function updateRunState() {
  const isPy = S.file?.endsWith(".py");
  const needPred = P().settings.predictFirst && !$("#predict").value.trim();
  const btn = $("#runBtn");
  btn.disabled = !isPy || needPred;
  btn.title = !isPy ? "Only Python files run here" : needPred ? "Write a prediction first (or untick 'Predict before running')" : "Run (Ctrl+Enter)";
  const f = S.day.files.find(x => x.name === S.file);
  $("#checkBtn").hidden = !f?.has_check;
}
let saveTimer;
function scheduleSave() { $("#saveState").textContent = "Unsaved"; clearTimeout(saveTimer); saveTimer = setTimeout(saveFile, 700); }
async function saveFile(announce) {
  clearTimeout(saveTimer);
  try { await api("/api/file", { day: S.day.folder, name: S.file, content: S.editor.getValue() }); $("#saveState").textContent = "Saved"; if (announce === true) toast("Saved"); }
  catch (e) { $("#saveState").textContent = "Save failed: " + e.message; }
}
async function resetFile() {
  if (!confirm(`Replace ${S.file} with the starter? Your current code in this file will be lost.`)) return;
  const f = S.day.files.find(x => x.name === S.file);
  S.editor.setValue(f.starter); await saveFile(); toast("Reset to starter");
}
async function runCurrent() {
  const btn = $("#runBtn"); if (btn.disabled) { if (!S.file.endsWith(".py")) return; return toast("Write your prediction first"); }
  btn.disabled = true; btn.textContent = "Running…";
  $("#output").innerHTML = `<div class="empty">Running ${esc(S.file)}…</div>`;
  try {
    const r = await api("/api/run", { day: S.day.folder, name: S.file, code: S.editor.getValue() });
    const pred = $("#predict").value.trim();
    $("#output").innerHTML = (pred ? compareHTML(pred, r) : "") + renderResult(r, !!pred);
    $("#saveState").textContent = "Saved"; logActivity();
  } catch (e) { $("#output").innerHTML = `<pre class="stderr">${esc(e.message)}\nIs the Bench server still running in your terminal?</pre>`; }
  btn.textContent = "Run"; updateRunState();
}
function renderResult(r, compared) {
  const status = r.timed_out ? `<span class="bad">Stopped (timeout)</span>` : r.returncode === 0 ? `<span class="ok">Finished</span>` : `<span class="bad">Exited with an error (code ${r.returncode})</span>`;
  return `<div class="out-meta">${status}<span>${r.seconds}s</span></div>
    ${r.stdout && !(compared && (r.stdout + r.stderr).trim().length <= 1200) ? `<pre class="stdout">${esc(r.stdout)}</pre>` : ""}
    ${r.stderr ? `<pre class="stderr">${esc(r.stderr)}</pre>` : ""}
    ${r.images.map(b => `<img alt="Plot from your script" src="data:image/png;base64,${b}">`).join("")}
    ${!r.stdout && !r.stderr && !r.images.length ? `<div class="empty">No output. Add print() calls to see results.</div>` : ""}`;
}

/* Prediction vs output, line by line: whitespace-insensitive, so "[1,2]" matches "[1, 2]". */
function compareHTML(pred, r) {
  const norm = l => l.replace(/\s+/g, "");
  const actual = r.stdout.trim().slice(0, 1200);
  const want = pred.split("\n").filter(l => l.trim()), got = actual.split("\n").filter(l => l.trim());
  let hits = 0;
  const yours = want.map((l, i) => { const ok = got[i] !== undefined && norm(l) === norm(got[i]); hits += ok; return `<span class="match-line ${ok ? "hit" : "miss"}">${esc(l)}</span>`; }).join("");
  const sum = got.length ? `<span class="match-sum">${hits}/${got.length} output line${got.length === 1 ? "" : "s"} predicted exactly</span>` : "";
  return `<div class="compare"><div class="yours"><b>You predicted</b>${yours}${sum}</div>
    <div class="actual"><b>Actual output</b>${esc(actual || (r.stderr ? "(error, see below)" : "(no output)"))}</div></div>`;
}

/* ---------- Checks ---------- */
const checkKey = (d, name) => `${d.folder}/${name}`;
function checkTick(d, f) {
  const c = f.has_check && P().checks[checkKey(d, f.name)];
  return c && c.passed === c.total ? `<span class="tick" title="All checks passed">✓</span>` : "";
}
async function checkCurrent() {
  const f = S.day.files.find(x => x.name === S.file); if (!f?.has_check) return;
  const btn = $("#checkBtn"); btn.disabled = true; btn.textContent = "Checking…";
  $("#output").innerHTML = `<div class="empty">Checking ${esc(S.file)}…</div>`;
  try {
    const r = await api("/api/check", { day: S.day.folder, name: S.file, code: S.editor.getValue() });
    const passed = r.results.filter(c => c.ok).length, total = r.results.length, all = passed === total;
    P().checks[checkKey(S.day, S.file)] = { passed, total, at: new Date().toISOString() };
    saveProgress(); logActivity();
    $("#output").innerHTML = `<div class="checks-head ${all ? "all" : "some"}"><b>${passed}/${total} checks passed</b>
      <span>${all ? "Everything checked is correct." : "Fix the first ✗ and check again."}</span><span class="out-meta">${r.seconds}s</span></div>
      <ul class="checks">${r.results.map(c => `<li class="${c.ok ? "pass" : "fail"}"><span class="icon">${c.ok ? "✓" : "✗"}</span>
        <span>${inline(c.label)}${!c.ok && c.hint ? `<span class="hint">${inline(c.hint)}</span>` : ""}${!c.ok && c.detail ? `<span class="detail">${esc(c.detail)}</span>` : ""}</span></li>`).join("")}</ul>`;
    const tab = document.querySelector(`.file[data-file="${CSS.escape(S.file)}"]`);
    if (tab) tab.innerHTML = esc(S.file) + checkTick(S.day, f);
    $("#saveState").textContent = "Saved";
    if (all) toast("All checks passed");
  } catch (e) { $("#output").innerHTML = `<pre class="stderr">${esc(e.message)}\nIs the Bench server still running in your terminal?</pre>`; }
  btn.disabled = false; btn.textContent = "Check";
}

/* ---------- Boot ---------- */
(async function init() {
  try {
    const [cur, prog] = await Promise.all([api("/api/curriculum"), api("/api/progress")]);
    S.weeks = cur.weeks; S.progress = prog; ensureProgress();
  } catch (e) {
    document.body.innerHTML = `<div class="locked"><h2>Bench can't reach its server</h2><p>Start it from your terminal with <code>python server.py</code>, then reload this page.</p></div>`;
    return;
  }
  renderStats();
  const t = todayISO();
  const pick = allDays().find(d => d.date === t) || (P().last.day && findDay(P().last.day)) || allDays().find(d => !dayDone(d)) || allDays()[0];
  selectDay(pick.id);
})();
